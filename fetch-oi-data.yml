name: Fetch open-interest data (one-off)

# Manual only: press "Run workflow" on the Actions tab. Downloads free public Binance data
# (no keys, read-only) and saves open interest to backtest-data/oi and buy/sell volume to backtest-data/flow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download open-interest history
        run: node fetch-oi-data.mjs
      - name: Save to repo
        run: |
          git config user.name "cipher-data"
          git config user.email "cipher-data@users.noreply.github.com"
          git add backtest-data/oi backtest-data/flow
          git commit -m "Add Binance open-interest + buy/sell volume history (hourly, 25 coins)" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
